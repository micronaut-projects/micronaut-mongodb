# WARNING: Do not edit this file directly. Instead, go to:
#
# https://github.com/micronaut-projects/micronaut-project-template/tree/master/.github/workflows
#
# and edit them there. Note that it will be sync'ed to all the Micronaut repos
name: Java CI
on:
  push:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+.x'
      # TEMPORARY: experiment, remove before merging
      - java-ci-test-shards-experiment
  pull_request:
    branches:
      - master
      - main
      - '[0-9]+.[0-9]+.x'
      # stacked PRs target each other's branches
      - 'python/**'
      - 'python-*'
    types: [opened, synchronize, reopened, ready_for_review]
# A new push to a pull request cancels its older run, freeing the shared runner
# pool. Pushes to branches get a group of their own and are never cancelled:
# they publish snapshots and docs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  # A module can run some of its test tasks in jobs of their own, in parallel with the build, by listing
  # them in gradle.properties: java-ci-test-shards=<tasks>,<tasks>,... where each comma separated group of
  # test tasks (e.g. ':my-module:test' or ':a:test :b:test') is one job. The build excludes them, and for
  # pull requests a separate sonar job analyses the coverage of the build and of every shard together.
  # Branch pushes always run every test in the build job, which publishes snapshots and docs.
  detect:
    name: "detect"
    if: github.repository != 'micronaut-projects/micronaut-project-template' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    outputs:
      sharded: ${{ steps.detect.outputs.sharded }}
      shards: ${{ steps.detect.outputs.shards }}
      exclusions: ${{ steps.detect.outputs.exclusions }}
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: gradle.properties
          sparse-checkout-cone-mode: false
      - name: "🔍 Detect test shards"
        id: detect
        run: |
          value=$(sed -n 's/^java-ci-test-shards=//p' gradle.properties 2>/dev/null | tail -n 1)
          # TEMPORARY: the experiment branch push runs like a pull request
          if { [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF_NAME" != "java-ci-test-shards-experiment" ]; } || [ -z "$value" ]; then
            {
              echo "sharded=false"
              echo "shards=[]"
              echo "exclusions="
            } >> "$GITHUB_OUTPUT"
            echo "All the tests run in the build job"
            exit 0
          fi
          if ! [[ "$value" =~ ^[A-Za-z0-9:._,\ -]+$ ]]; then
            echo "::error::java-ci-test-shards may only contain Gradle task paths separated by spaces and commas: $value"
            exit 1
          fi
          shards=$(jq -cn --arg value "$value" '$value | split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0))')
          exclusions=$(echo "$value" | tr ',' ' ' | xargs -n1 | sed 's/^/-x /' | paste -sd' ' -)
          {
            echo "sharded=true"
            echo "shards=$shards"
            echo "exclusions=$exclusions"
          } >> "$GITHUB_OUTPUT"
          echo "Test shards: $shards"
  build:
    name: "build"
    needs: detect
    if: github.repository != 'micronaut-projects/micronaut-project-template' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25']
    outputs:
      # Outcome of the static analysis step: success, failure or skipped (no Sonar token, e.g. fork pull requests)
      sonar: ${{ steps.sonar.outcome }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      SONAR_TOKEN_AVAILABLE: ${{ secrets.SONAR_TOKEN != '' }}
      # Branch pushes write to the remote build cache so later jobs and pull requests reuse
      # their outputs; pull requests only read. Set explicitly: the setup-gradle token makes the
      # micronaut-build settings plugin detect CI on every build, which would otherwise push.
      ORG_GRADLE_PROJECT_cachePush: ${{ github.event_name == 'push' && (github.ref_name == 'master' || github.ref_name == 'main' || endsWith(github.ref_name, '.x')) }}
    steps:
       # https://github.com/actions/virtual-environments/issues/709
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)
      - name: "🗑 Free disk space"
        run: |
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"
         sudo rm -rf "/opt/ghc"
         sudo rm -rf "/usr/share/dotnet"
         sudo rm -rf "/usr/local/lib/android"
         sudo apt-get clean
         df -h

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          distribution: 'graalvm'
          java-version: ${{ matrix.java }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # Exchanged for a short-lived token that the following steps receive as DEVELOCITY_ACCESS_KEY and
          # GRADLE_ENTERPRISE_ACCESS_KEY, so the long-lived key never reaches the build. Pushes use the writer key.
          # Other events use DEVELOCITY_PULL_REQUEST_ACCESS_KEY, a key whose Develocity user cannot write to the
          # build cache, and fall back to the writer key until that secret exists.
          develocity-access-key: >-
            ${{ (github.event_name == 'push' && secrets.GRADLE_ENTERPRISE_ACCESS_KEY) ||
                (github.event_name != 'push' && (secrets.DEVELOCITY_PULL_REQUEST_ACCESS_KEY || secrets.GRADLE_ENTERPRISE_ACCESS_KEY)) ||
                '' }}

      - name: "❓ Optional setup step"
        run: |
          [ -f ./setup.sh ] && ./setup.sh || [ ! -f ./setup.sh ]

      - name: "🛠 Build with Gradle"
        id: gradle
        env:
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          # -x for each test task of the shards, which run in the test-shards jobs
          SHARD_EXCLUSIONS: ${{ needs.detect.outputs.exclusions }}
        run: |
          read -ra exclusions <<< "$SHARD_EXCLUSIONS"
          ./gradlew check jacocoReport --no-daemon --continue "${exclusions[@]}"

      # For the sonar job, which analyses the coverage data of the build with the one of the shards
      - name: "🏷 Mark coverage data"
        if: needs.detect.outputs.sharded == 'true'
        # Always uploaded with the coverage data: the artifact exists even when the tests produced none, and
        # the paths of the coverage data stay relative to the repository root
        run: echo "${{ github.job }}" > .coverage-data
      - name: "📤 Upload coverage data"
        if: needs.detect.outputs.sharded == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-build
          path: |
            .coverage-data
            **/build/jacoco/*.exec
          include-hidden-files: true
          if-no-files-found: error
          # A failed job can be re-run up to 30 days after the run: the sonar job then needs the coverage data
          # of the jobs that are not re-run
          retention-days: 30
          overwrite: true

      - name: "🔎 Run static analysis"
        id: sonar
        # With test shards, the sonar job analyses the coverage of the build and of the shards
        if: env.SONAR_TOKEN_AVAILABLE == 'true' && matrix.java == '25' && needs.detect.outputs.sharded != 'true'
        # Waits for the quality gate so a failing gate stops the native and Python tests, but does not
        # fail this job: snapshot and docs publishing below keep running on branch pushes.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew sonar --no-parallel --continue -Dsonar.qualitygate.wait=true

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        with:
          check_name: Java CI / Test Report (${{ matrix.java }})
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_retries: 'true'

      - name: "📜 Upload binary compatibility check results"
        if: matrix.java == '25'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-compatibility-reports
          path: "**/build/reports/binary-compatibility-*.html"

      - name: "📦 Publish to Sonatype Snapshots"
        if: success() && github.event_name == 'push' && matrix.java == '25' && (github.ref_name == 'master' || github.ref_name == 'main' || endsWith(github.ref_name, '.x'))
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: ./gradlew publishToSonatype docs --no-daemon

      - name: "❓ Determine docs target repository"
        uses: haya14busa/action-cond@94f77f7a80cd666cb3155084e428254fea4281fd # v1
        id: docs_target
        with:
          cond: ${{ github.repository == 'micronaut-projects/micronaut-core' }}
          if_true: "micronaut-projects/micronaut-docs"
          if_false: ${{ github.repository }}

      - name: "📑 Publish to Github Pages"
        if: success() && github.event_name == 'push' && matrix.java == '25' && (github.ref_name == 'master' || github.ref_name == 'main' || endsWith(github.ref_name, '.x'))
        uses: micronaut-projects/github-pages-deploy-action@76d63aafbab7108d74e83be4e5b3b0501382e829 # master
        env:
          TARGET_REPOSITORY: ${{ steps.docs_target.outputs.value }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build/docs

      - name: "❓ Optional cleanup step"
        run: |
          [ -f ./cleanup.sh ] && ./cleanup.sh || [ ! -f ./cleanup.sh ]
  test-shards:
    name: "test (${{ matrix.tasks }})"
    needs: detect
    if: needs.detect.outputs.sharded == 'true'
    runs-on: ubuntu-latest
    strategy:
      # every shard reports its own tests
      fail-fast: false
      matrix:
        tasks: ${{ fromJson(needs.detect.outputs.shards) }}
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      # Shards only run for pull requests, which only read the remote build cache
      ORG_GRADLE_PROJECT_cachePush: false
    steps:
       # https://github.com/actions/virtual-environments/issues/709
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)
      - name: "🗑 Free disk space"
        run: |
         sudo rm -rf "/usr/local/share/boost"
         sudo rm -rf "$AGENT_TOOLSDIRECTORY"
         sudo rm -rf "/opt/ghc"
         sudo rm -rf "/usr/share/dotnet"
         sudo rm -rf "/usr/local/lib/android"
         sudo apt-get clean
         df -h

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_PULL_REQUEST_ACCESS_KEY || secrets.GRADLE_ENTERPRISE_ACCESS_KEY || '' }}

      - name: "❓ Optional setup step"
        run: |
          [ -f ./setup.sh ] && ./setup.sh || [ ! -f ./setup.sh ]

      - name: "🛠 Test with Gradle"
        env:
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          SHARD_TASKS: ${{ matrix.tasks }}
        run: |
          read -ra tasks <<< "$SHARD_TASKS"
          ./gradlew "${tasks[@]}" --no-daemon --continue

      - name: "📊 Publish Test Report"
        if: always()
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        with:
          check_name: Java CI / Test Report (${{ matrix.tasks }})
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_retries: 'true'

      - name: "🏷 Mark coverage data"
        # Always uploaded with the coverage data: the artifact exists even when the tests produced none, and
        # the paths of the coverage data stay relative to the repository root
        run: echo "${{ github.job }}" > .coverage-data
      - name: "📤 Upload coverage data"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-shard-${{ strategy.job-index }}
          path: |
            .coverage-data
            **/build/jacoco/*.exec
          include-hidden-files: true
          if-no-files-found: error
          # A failed job can be re-run up to 30 days after the run: the sonar job then needs the coverage data
          # of the jobs that are not re-run
          retention-days: 30
          overwrite: true

      - name: "❓ Optional cleanup step"
        run: |
          [ -f ./cleanup.sh ] && ./cleanup.sh || [ ! -f ./cleanup.sh ]
  # With test shards, analyses the coverage data of the build and of every shard together, as the build
  # job does without shards
  sonar:
    name: "sonar"
    needs: [detect, build, test-shards]
    if: needs.detect.outputs.sharded == 'true'
    runs-on: ubuntu-latest
    outputs:
      # Outcome of the static analysis step: success, failure or skipped (no Sonar token, e.g. fork pull requests)
      sonar: ${{ steps.sonar.outcome }}
    env:
      SONAR_TOKEN_AVAILABLE: ${{ secrets.SONAR_TOKEN != '' }}
      ORG_GRADLE_PROJECT_cachePush: false
    steps:
       # https://github.com/actions/virtual-environments/issues/709
      - name: Remove system JDKs
        run: |
          sudo rm -rf /usr/lib/jvm/*
          unset JAVA_HOME
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/usr/lib/jvm' | paste -sd:)

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_PULL_REQUEST_ACCESS_KEY || secrets.GRADLE_ENTERPRISE_ACCESS_KEY || '' }}

      - name: "📥 Download coverage data"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: coverage-*
          # One directory per artifact, to check that none is missing
          path: ${{ runner.temp }}/coverage

      - name: "🧩 Merge coverage data"
        # The analysis needs the coverage data of the build and of every shard, or Sonar would report a lower
        # coverage
        env:
          SHARDS: ${{ needs.detect.outputs.shards }}
        run: |
          expected="coverage-build"
          for index in $(seq 0 $(( $(jq length <<< "$SHARDS") - 1 ))); do
            expected="$expected coverage-shard-$index"
          done
          for name in $expected; do
            if [ ! -f "$RUNNER_TEMP/coverage/$name/.coverage-data" ]; then
              echo "::error::The coverage data $name is missing"
              exit 1
            fi
            cp -R "$RUNNER_TEMP/coverage/$name/." .
          done

      - name: "🔎 Run static analysis"
        id: sonar
        if: env.SONAR_TOKEN_AVAILABLE == 'true'
        # Same as the step of the build job. The tests ran in the build and test-shards jobs: the aggregated
        # coverage report reads the coverage data downloaded from them.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GH_TOKEN_PUBLIC_REPOS_READONLY: ${{ secrets.GH_TOKEN_PUBLIC_REPOS_READONLY }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
        run: |
          ./gradlew sonar -x test --no-parallel --continue -Dsonar.qualitygate.wait=true
  # Native and Python tests start only when the build, the test shards and their tests passed and the Sonar
  # quality gate did not fail, so a red or cancelled build never takes runners for their matrices.
  native:
    needs: [detect, build, test-shards, sonar]
    # With test shards, the shards and the sonar job must succeed; without, they are skipped
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.build.outputs.sonar != 'failure' &&
      (needs.detect.outputs.sharded != 'true' ||
        (needs.test-shards.result == 'success' && needs.sonar.result == 'success' && needs.sonar.outputs.sonar != 'failure'))
    uses: ./.github/workflows/graalvm-latest.yml
    secrets: inherit
  python:
    needs: [detect, build, test-shards, sonar]
    # With test shards, the shards and the sonar job must succeed; without, they are skipped
    if: >-
      !cancelled() && needs.build.result == 'success' && needs.build.outputs.sonar != 'failure' &&
      (needs.detect.outputs.sharded != 'true' ||
        (needs.test-shards.result == 'success' && needs.sonar.result == 'success' && needs.sonar.outputs.sonar != 'failure'))
    uses: ./.github/workflows/python.yml
    secrets: inherit
